bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0

    navigators:
      - navigate_to_pose
      - navigate_through_poses

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code


controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01

    progress_checker_plugins:
      - progress_checker

    goal_checker_plugins:
      - goal_checker

    controller_plugins:
      - FollowPath

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 3.14
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.0
      lookahead_dist: 2.0
      min_lookahead_dist: 1.0
      max_lookahead_dist: 5.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      use_rotate_to_heading: false
      allow_reversing: false
      use_velocity_scaled_lookahead_dist: true


planner_server:
  ros__parameters:
    planner_plugins:
      - GridBased

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true


global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 2.0
      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link

      robot_radius: 1.0
      resolution: 0.5

      rolling_window: true
      width: 300
      height: 300
      track_unknown_space: true

      plugins:
        - obstacle_layer
        - sam2_obstacle_layer
        - kelp_keepout_layer
        - inflation_layer

      obstacle_layer:
        # TEMPORARILY disabled: the LiDAR is picking up the boat's own bow/hull
        # as a stable ~1.5-2.9m false obstacle, which was blocking every
        # autonomous move. Needs a proper min-range self-filter (or mount/
        # calibration check) before re-enabling for real collision avoidance.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: false
        observation_sources: fused_obstacles

        fused_obstacles:
          topic: /obstacles/fused
          data_type: "PointCloud2"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.5
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0

      # Separate from obstacle_layer above (new pipeline, independent
      # enable flag) so the Kelp SAM2/fusion obstacles can be brought up
      # without being coupled to the existing, currently-disabled, bow/hull
      # false-positive issue tracked on obstacle_layer. Nav2's ObstacleLayer
      # doesn't natively consume vision_msgs/Detection3DArray, so
      # geo_fusion_tracker_node also republishes each confirmed track's
      # footprint corners + centroid as a plain PointCloud2 on this topic
      # (see that node's publishTrackedPointCloud()) specifically for this
      # layer to mark/clear from.
      sam2_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: fused_tracked_obstacles
        fused_tracked_obstacles:
          topic: /obstacles/fused_tracked_points
          data_type: "PointCloud2"
          clearing: true
          marking: true
          max_obstacle_height: 2.5
          min_obstacle_height: 0.0
          obstacle_max_range: 35.0
          obstacle_min_range: 0.5
          raytrace_max_range: 40.0
          raytrace_min_range: 0.0

      # Dynamic kelp-canopy keep-out, fed by fusion/kelp_keepout_costmap_node
      # (see that file's docstring for why this is NOT wired to
      # /fusion/canopy_polygon directly — KeepOutFilter needs an
      # OccupancyGrid mask + CostmapFilterInfo, not a PolygonStamped).
      # CAVEAT: filter_info_topic is this layer's only declared param here,
      # matching the documented Costmap Filters pattern as best known, but
      # was not verified against the live Nav2 Jazzy nav2_costmap_2d source
      # in this change (no network/source access) — confirm
      # KeepOutFilter's actual declared parameter names before trusting
      # this zone in the water (see T-equivalent bench test in
      # KELP_CAPABILITIES.md's style, e.g. float a kelp mat and confirm the
      # planner actually diverts, per the design note's G-06).
      kelp_keepout_layer:
        plugin: "nav2_costmap_2d::KeepoutFilter"  # was KeepOutFilter: no such class, the costmap failed to load it
        enabled: true
        filter_info_topic: "/costmap_filter_info"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 2.0


local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 2.0
      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 20
      height: 20
      resolution: 0.1

      robot_radius: 1.0

      plugins:
        - obstacle_layer
        - sam2_obstacle_layer
        - kelp_keepout_layer
        - inflation_layer

      obstacle_layer:
        # TEMPORARILY disabled: the LiDAR is picking up the boat's own bow/hull
        # as a stable ~1.5-2.9m false obstacle, which was blocking every
        # autonomous move. Needs a proper min-range self-filter (or mount/
        # calibration check) before re-enabling for real collision avoidance.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: false
        observation_sources: fused_obstacles

        fused_obstacles:
          topic: /obstacles/fused
          data_type: "PointCloud2"
          clearing: true
          marking: true

      # Same source and reasoning as global_costmap's sam2_obstacle_layer
      # above — kept independently enabled from the existing, disabled
      # obstacle_layer, and independently reactive at local_costmap's
      # tighter update rate for close-range avoidance.
      sam2_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: fused_tracked_obstacles
        fused_tracked_obstacles:
          topic: /obstacles/fused_tracked_points
          data_type: "PointCloud2"
          clearing: true
          marking: true

      # local_costmap's global_frame is odom while the keep-out mask is
      # published in map — this is the same cross-frame pattern Nav2's own
      # Costmap Filters tutorial uses (filter layers resolve mask<->costmap
      # frame via TF internally), not an oversight.
      kelp_keepout_layer:
        plugin: "nav2_costmap_2d::KeepoutFilter"  # was KeepOutFilter: no such class, the costmap failed to load it
        enabled: true
        filter_info_topic: "/costmap_filter_info"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.5


behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      - wait
      - spin
      - backup

    wait:
      plugin: "nav2_behaviors::Wait"

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"


collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom

    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: nav2/cmd_vel
    state_topic: collision_monitor_state

    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    polygons:
      - FootprintApproach
      - FootprintStop
      - SafetySlow

    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: false

    # Defect C3 fix: a hard-stop reflex polygon, independent of
    # FootprintApproach above (left disabled pending its own tuning — see
    # that block's comment history) and independent of whatever Nav2
    # planning/control is doing. Tune the point list against a real
    # measured d_stop (KELP_MISSIONS.md M2's detection-horizon rule) before
    # trusting these numbers in the water; the values here are a
    # conservative starting point, not a validated stopping distance.
    FootprintStop:
      type: "polygon"
      # A string, not a YAML list: Jazzy reads polygon points as "[[x, y], ...]",
      # and a nested list makes the whole params file unparseable (every Nav2 node died).
      points: "[[0.75, 0.40], [0.75, -0.40], [-0.75, -0.40], [-0.75, 0.40]]"
      action_type: "stop"
      min_points: 3
      visualize: true
      enabled: true

    SafetySlow:
      type: "polygon"
      # A string, not a YAML list: Jazzy reads polygon points as "[[x, y], ...]",
      # and a nested list makes the whole params file unparseable (every Nav2 node died).
      points: "[[3.5, 1.2], [3.5, -1.2], [-0.5, -1.2], [-0.5, 1.2]]"
      action_type: "slowdown"
      slowdown_ratio: 0.35
      min_points: 4
      visualize: true
      enabled: true

    observation_sources:
      - lidar
      - sam2_pointcloud

    lidar:
      type: "scan"
      topic: /lidar_driver/scan_raw
      min_height: 0.0
      max_height: 2.0
      enabled: true

    # Added alongside the existing 2D lidar source, not instead of it —
    # defense in depth while the new water-filtered 3D pipeline is unproven
    # on real water. Disable "lidar" only once sam2_pointcloud has its own
    # bench/water validation (KELP_CAPABILITIES.md T17-equivalent for this
    # pipeline).
    sam2_pointcloud:
      type: "pointcloud"
      topic: /lidar/filtered_obstacles
      min_height: 0.05
      max_height: 2.0
      enabled: true
