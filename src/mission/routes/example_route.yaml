# Example planned-route file for mission/waypoint_route_loader.py.
#
# Drop a copy of this (edited with your own waypoints) anywhere on disk and
# point the `route_file` launch argument at it, e.g.:
#
#   ros2 launch bringup njord.launch.py \
#       enable_waypoint_route_loader:=true \
#       route_file:=/absolute/path/to/your_route.yaml
#
# The loader polls this file's mtime every `poll_interval_sec` (default 2s)
# and republishes njord_msgs/PlannedRoute on /mission/planned_route whenever
# it changes, so you can edit and re-save this file while the system is
# running and watch the red line move on the dashboard map.
#
# This produces a REFERENCE LINE ONLY — it is for a human pilot to steer
# along manually. Nothing in this package or in the ROS graph drives the
# boat automatically from this file.
#
# Waypoint order is the order the line is drawn in (first entry = line
# start). Latitude must be in [-90, 90], longitude in [-180, 180].

name: "Shearwater Bay kelp-line survey"
waypoints:
  - lat: -26.6385
    lon: 15.1528
  - lat: -26.6372
    lon: 15.1541
  - lat: -26.6361
    lon: 15.1557
  - lat: -26.6358
    lon: 15.1580
