cloud_telemetry_bridge_node:
  ros__parameters:
    # Must carry ?role=asv to match cloudflare/worker-telemetry-relay.js's
    # routing — omitting it makes the Worker treat the boat as a browser
    # listener and the pipeline relays nothing. See this node's own
    # docstring for the full explanation.
    # Empty = live WebSocket relay off. The Cloudflare Worker was never
    # deployed and telemetry.asket-namibia.internal does not resolve, so the
    # old default only produced reconnect warnings. Set it to a real relay,
    # e.g. "wss://<host>/api/v1/telemetry/stream?role=asv", to turn it on.
    cloud_ws_url: ""
    asv_id: "ASKET_02"
    stream_rate_hz: 5.0
    map_frame: map
    camera_compressed_topic: "/oak/rgb/image_raw/compressed"
    wifi_interface: "wlan0"
    sonar_cloud_points: 60          # strongest sonar returns per ping sent to the cloud

    # Azure Blob Storage history (cloud_bridge/azure_sink.py, cloud/azure/README.md).
    # The connection string is a secret: keep it in this file on the Jetson
    # (chmod 600), never in git. AZURE_STORAGE_CONNECTION_STRING overrides it.
    # Off by default: gui_cloud_mirror (below) feeds the cloud cockpit, and
    # running both doubles the Azure writes for the same picture.
    azure_enabled: false
    azure_connection_string_file: "/data/secrets/azure_storage_connection_string"
    azure_container: "telemetry"
    azure_spool_dir: "/data/cloud_spool"
    azure_record_rate_hz: 1.0       # packets per second written to the cloud
    azure_image_interval_s: 5.0     # one camera snapshot every N s (0 = none)
    azure_upload_interval_s: 2.0
    azure_keep_local_images: false

sonar_bridge_node:
  ros__parameters:
    sonarlink_ws_url: "ws://127.0.0.1:7077/connect_ws?session_id=1"
    n_bins: 100
    decimate_to_pps: 5.0

# gui_backend -> Azure mirror for the cloud-hosted cockpit (gui_mirror_node.py).
# LIGHT profile: the full record stays on the Jetson; the cloud gets a small live
# state and a sparse history. Nothing is deleted in Azure automatically.
# About 1 M Azure writes a month (~$5-7) and ~0.3 GB/day on the boat's uplink.
gui_cloud_mirror:
  ros__parameters:
    gui_ws_url: "ws://127.0.0.1:8090/ws"
    asv_id: "ASKET_02"              # blobs under ASKET_02/gui/
    record_rate_hz: 1.0
    latest_interval_s: 3.0          # live view refresh; keep < 6 s (the cockpit's link-loss limit)
    history_interval_s: 15.0        # one light history line (position, status, alarms)
    upload_interval_s: 30.0         # history appends
    image_interval_s: 30.0          # one snapshot every 30 s (0 = none)
    image_max_width: 320
    image_quality: 60
    track_max_points: 300           # live track tail; the full track is on the Jetson
    azure_connection_string_file: "/data/secrets/azure_storage_connection_string"
    azure_container: "telemetry"
    spool_dir: "/data/cloud_spool_gui"
